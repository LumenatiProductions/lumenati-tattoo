<!-- ── SHOPBOT — Clippy is the front desk, answered by Claude ── -->
<!-- No window of its own: the chat lives in Clippy's speech bubble (the
     Clippy markup and the drag engine come with the code-injection footer,
     rendered after this block, so the script waits for them). Opens on
     Clippy's "Ask ShopBot" button, on a click on Clippy himself, or on the
     window event 'lmn-shopbot-open'. -->
<style>
  #clippy-bubble.lmn-sb-chat { max-width: 320px; width: 320px; padding: 8px 8px 8px; }
  /* The bundle's own visible rule loads after this block, so the tuck must outrank it. */
  #clippy-container.clippy-visible.clippy-quiet #clippy-bubble { opacity: 0 !important; transform: scale(0.8) !important; pointer-events: none !important; transition-delay: 0s !important; }
  #clippy-container.clippy-gone { display: none !important; }
  #clippy-container.clippy-quiet #clippy-character { scale: 0.72; transform-origin: bottom left; }
  #clippy-character { cursor: pointer; }
  .lmn-sb-head { display: flex; justify-content: space-between; align-items: center; font: bold 11px Tahoma, Arial, sans-serif; color: #000; padding: 0 2px 6px; }
  .lmn-sb-head .lmn-sb-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #FFD700; border: 1px solid #806000; margin-right: 5px; vertical-align: -1px; }
  .lmn-sb-x { cursor: pointer; font-size: 12px; color: #555; padding: 0 4px; }
  .lmn-sb-x:hover { color: #000; }
  .lmn-sb-log { background: #fff; border: 1px solid #999; height: 210px; overflow-y: auto; padding: 6px 8px; font-family: Tahoma, Arial, sans-serif; font-size: 13px; line-height: 1.4; color: #000; text-align: left; }
  .lmn-sb-line { margin: 0 0 6px; word-wrap: break-word; }
  .lmn-sb-time { color: #808080; font-size: 10px; margin-right: 4px; }
  .lmn-sb-who { font-weight: bold; }
  .lmn-sb-line.me .lmn-sb-who { color: #c00000; }
  .lmn-sb-line.bot .lmn-sb-who { color: #0000c0; }
  .lmn-sb-line a { color: #0000ff; text-decoration: underline; }
  .lmn-sb-line a:hover { color: #ff0000; }
  .lmn-sb-typing { font-family: Tahoma, Arial, sans-serif; font-size: 10px; color: #808080; padding: 2px 2px 0; height: 14px; text-align: left; }
  .lmn-sb-typing.on::after { content: 'lumenati_bot is typing...'; }
  .lmn-sb-compose { display: flex; gap: 4px; padding-top: 4px; }
  .lmn-sb-input {
    flex: 1; min-width: 0; padding: 6px 8px; font-family: Tahoma, Arial, sans-serif; font-size: 14px; color: #000;
    background: #fff; border: 1px solid; border-color: #808080 #fff #fff #808080; outline: none;
  }
  .lmn-sb-send {
    padding: 4px 14px; font-family: Tahoma, Arial, sans-serif; font-size: 12px; font-weight: bold; color: #000;
    background: linear-gradient(180deg, #fff 0%, #ece9d8 50%, #d4d0c8 100%);
    border: 1px solid; border-color: #fff #404040 #404040 #fff; cursor: pointer;
  }
  .lmn-sb-send:active { border-color: #404040 #fff #fff #404040; }
  .lmn-sb-send:disabled { color: #808080; cursor: default; }
  .lmn-sb-foot { font-size: 10px; color: #666; padding: 5px 2px 0; text-align: left; }
  @media (max-width: 640px) {
    #clippy-bubble.lmn-sb-chat { width: calc(100vw - 40px); max-width: calc(100vw - 40px); }
    .lmn-sb-log { height: 40vh; }
  }
</style>

<script>
(function () {
  if (window.__lmnSbBound) return;
  window.__lmnSbBound = true;

  var KEY = 'lmn-shopbot';
  var history = [];
  try { history = JSON.parse(sessionStorage.getItem(KEY) || '[]') || []; } catch (e) { history = []; }
  var busy = false;
  var container, bubble, log, typing, form, input, send, promptHtml = null;

  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(history.slice(-24))); } catch (e) {} }
  function stamp(d) {
    d = d || new Date();
    var h = d.getHours(), m = d.getMinutes();
    return '(' + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM') + ')';
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // Site paths and emails the bot mentions become real links.
  function linkify(s) {
    return esc(s)
      .replace(/(^|[\s(])(\/(?:request\?artist=[A-Za-z0-9-]+|book|flash-wall|arcade(?:\/[a-z]+(?:\/wall)?)?|tv|[a-z0-9-]+))(?=$|[\s.,!?)])/g, function (m, pre, path) {
        return pre + '<a href="' + path + '">' + path + '</a>';
      })
      .replace(/([a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,})/gi, '<a href="mailto:$1">$1</a>');
  }
  function line(role, text, when) {
    var el = document.createElement('div');
    el.className = 'lmn-sb-line ' + (role === 'user' ? 'me' : 'bot');
    el.innerHTML = '<span class="lmn-sb-time">' + stamp(when ? new Date(when) : null) + '</span>' +
      '<span class="lmn-sb-who">' + (role === 'user' ? 'you' : 'clippy') + ':</span> <span class="lmn-sb-text">' + linkify(text) + '</span>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function greet() {
    if (history.length) return;
    var hello = "hey, front desk here. ask me who's tattooing, how booking works, or what's on the flash wall.";
    history.push({ role: 'assistant', content: hello, at: Date.now() });
    save();
  }
  function render() {
    log.innerHTML = '';
    for (var i = 0; i < history.length; i++) line(history[i].role, history[i].content, history[i].at);
  }

  // Turn the speech bubble into the chat (once); the original prompt is kept
  // so Go away can put it back for the next session.
  function mount() {
    if (log) return true;
    container = document.getElementById('clippy-container');
    bubble = document.getElementById('clippy-bubble');
    if (!container || !bubble) return false;
    promptHtml = bubble.innerHTML;
    return true;
  }
  function chatMode() {
    bubble.classList.add('lmn-sb-chat');
    bubble.innerHTML =
      '<div class="lmn-sb-head"><span><span class="lmn-sb-dot"></span>clippy // the front desk</span><span><span class="lmn-sb-x" id="lmn-sb-tuck" title="Tuck Clippy in the corner">_</span><span class="lmn-sb-x" id="lmn-sb-close" title="Go away for now">&#10005;</span></span></div>' +
      '<div class="lmn-sb-log" id="lmn-sb-log" aria-live="polite"></div>' +
      '<div class="lmn-sb-typing" id="lmn-sb-typing"></div>' +
      '<form class="lmn-sb-compose" id="lmn-sb-form" autocomplete="off">' +
        '<input class="lmn-sb-input" id="lmn-sb-input" type="text" maxlength="400" placeholder="ask about the shop, the artists, booking..." aria-label="Message" />' +
        '<button class="lmn-sb-send" id="lmn-sb-send" type="submit">Send</button>' +
      '</form>' +
      '<div class="lmn-sb-foot">Clippy can\'t book you in, but he knows the way.</div>' +
      '<div id="clippy-bubble-tail"></div>';
    log = document.getElementById('lmn-sb-log');
    typing = document.getElementById('lmn-sb-typing');
    form = document.getElementById('lmn-sb-form');
    input = document.getElementById('lmn-sb-input');
    send = document.getElementById('lmn-sb-send');
    document.getElementById('lmn-sb-tuck').addEventListener('click', close);
    document.getElementById('lmn-sb-close').addEventListener('click', gone);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || busy) return;
      input.value = '';
      history.push({ role: 'user', content: text, at: Date.now() });
      save();
      line('user', text);
      ask();
    });
  }

  function open() {
    if (!mount()) return;
    container.classList.remove('clippy-gone');
    try { sessionStorage.removeItem('clippy-gone'); } catch (e) {}
    if (!log) chatMode();
    greet();
    render();
    container.style.display = '';
    container.classList.remove('clippy-hiding');
    container.classList.remove('clippy-quiet');
    container.classList.add('clippy-visible');
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
  }
  // Tuck keeps Clippy in the corner, bubble away: one click brings the chat back.
  function close() {
    if (container) container.classList.add('clippy-quiet');
  }
  // Gone hides him for the rest of this visit (the session), like the old Go away.
  function gone() {
    if (container) container.classList.add('clippy-gone');
    try { sessionStorage.setItem('clippy-gone', '1'); } catch (e) {}
  }

  window.addEventListener('lmn-shopbot-open', open);
  window.addEventListener('lmn-shopbot-close', close);
  // Clippy himself is the button.
  var tries = 0;
  (function bind() {
    var ch = document.getElementById('clippy-character');
    if (ch) { ch.addEventListener('click', function () { open(); }); return; }
    if (++tries < 100) setTimeout(bind, 50);
  })();

  function ask() {
    busy = true;
    send.disabled = true;
    typing.classList.add('on');
    var payload = history.slice(-12).map(function (m) { return { role: m.role, content: m.content }; });
    var el = null, textEl = null, out = '';
    function finish(final) {
      typing.classList.remove('on');
      busy = false;
      send.disabled = false;
      if (final) {
        history.push({ role: 'assistant', content: final, at: Date.now() });
        save();
        if (textEl) textEl.innerHTML = linkify(final);
      }
    }
    fetch('/api/site/shopbot', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: payload })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          var msg = r.status === 503 ? 'ShopBot is away from the desk. email hi@lumenatitattoo.com and a human will get back to you.'
            : r.status === 429 ? 'slow down a sec, the desk is slammed.' : (j.error || 'hmm, that did not go through. try again?');
          line('assistant', msg);
          finish(msg);
        });
      }
      if (!r.body || !r.body.getReader) {
        return r.text().then(function (t) { line('assistant', t); finish(t); });
      }
      var reader = r.body.getReader(), dec = new TextDecoder();
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) { finish(out); return; }
          out += dec.decode(res.value, { stream: true });
          if (!el) { el = line('assistant', ''); textEl = el.querySelector('.lmn-sb-text'); }
          textEl.textContent = out;
          log.scrollTop = log.scrollHeight;
          return pump();
        });
      }
      return pump();
    }).catch(function () {
      var msg = 'lost the connection. try that again?';
      line('assistant', msg);
      finish(msg);
    });
  }
})();
</script>
