<!-- Unlock audio on first touch for mobile -->
<script>
(function(){
  var unlocked = false;
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    var a = new Audio();
    a.play().catch(function(){});
    a.pause();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  }
  document.addEventListener('touchstart', unlock, {once:true});
  document.addEventListener('click', unlock, {once:true});
})();
</script>

<script>
// ── Drag engine (site-wide) ─────────────────────────────────────────────
// One grab behaviour for everything that moves: room windows, stickers,
// posters, polaroids, Winamp. Pointer events (mouse, pen, touch on tablets),
// pointer capture so a fast drag never loses the element, the grabbed thing
// comes to the front, and picking a window out of the desktop's flow freezes
// every other window in place first so nothing jumps into the gap.
(function(){
  var zTop=500,onDrop=null,resetBtn=null;
  var NO_GRAB='a, button, input, textarea, select, .br-btn, .br-aim-btn, .br-thumb, .br-lightbox, .bedroom-mobile-btn';
  var smallTouch=('ontouchstart' in window)&&window.innerWidth<768; // phones scroll, they don't drag
  document.addEventListener('dragstart',function(e){if(e.target.closest&&e.target.closest('.lmn-draggable'))e.preventDefault();});

  function freezeFlow(container){
    if(container.__lmnFrozen)return;container.__lmnFrozen=true;
    var items=[].slice.call(container.querySelectorAll('.br-win')),rects=[];
    var crect=container.getBoundingClientRect();
    items.forEach(function(el){rects.push(el.getBoundingClientRect());});
    container.style.minHeight=container.getBoundingClientRect().height+'px';
    items.forEach(function(el,i){var r=rects[i];var cs=getComputedStyle(el);if(cs.position==='absolute'||cs.position==='fixed')return;
      el.style.width=r.width+'px';el.style.position='absolute';el.style.left=(r.left-crect.left)+'px';el.style.top=(r.top-crect.top)+'px';el.style.margin='0';});
  }

  function attach(el,opts){
    opts=opts||{};
    if(el.__lmnDrag)return;el.__lmnDrag=true;
    el.classList.add('lmn-draggable');
    var handle=opts.handle||el,container=opts.container||null,fixed=!!opts.fixed;
    if(!smallTouch)handle.style.touchAction='none';
    var active=null;
    handle.addEventListener('pointerdown',function(e){
      if(smallTouch)return;
      if(e.button!==0&&e.pointerType==='mouse')return;
      if(e.target.closest&&e.target.closest(NO_GRAB))return;
      if(container)freezeFlow(container);
      var r=el.getBoundingClientRect();
      var base=fixed?{left:0,top:0}:(el.offsetParent||document.body).getBoundingClientRect();
      var cs=getComputedStyle(el);
      if(cs.position!=='absolute'&&cs.position!=='fixed'){el.style.width=r.width+'px';el.style.position=fixed?'fixed':'absolute';}
      el.style.left=(r.left-base.left)+'px';el.style.top=(r.top-base.top)+'px';el.style.right='auto';el.style.bottom='auto';el.style.margin='0';el.style.transition='none';
      el.style.zIndex=String(++zTop);
      active={id:e.pointerId,offX:e.clientX-r.left,offY:e.clientY-r.top,w:r.width,h:r.height,base:base};
      try{handle.setPointerCapture(e.pointerId);}catch(x){}
      el.classList.add('lmn-dragging');document.body.classList.add('lmn-drag-live');
      e.preventDefault();
    });
    function move(e){
      if(!active||e.pointerId!==active.id)return;
      var x=e.clientX-active.offX,y=e.clientY-active.offY;
      if(fixed){x=Math.max(0,Math.min(window.innerWidth-active.w,x));y=Math.max(0,Math.min(window.innerHeight-active.h,y));}
      else{x=Math.max(-active.w*0.6,x);y=Math.max(-active.h*0.3,y);}
      el.style.left=(x-active.base.left)+'px';el.style.top=(y-active.base.top)+'px';
      // The desktop grows to keep a window dragged past its bottom edge in reach.
      if(container){var bottom=(y-active.base.top)+active.h+32;if(bottom>container.clientHeight)container.style.minHeight=bottom+'px';}
    }
    function end(e){
      if(!active||e.pointerId!==active.id)return;
      try{handle.releasePointerCapture(e.pointerId);}catch(x){}
      active=null;el.classList.remove('lmn-dragging');document.body.classList.remove('lmn-drag-live');
      if(container&&onDrop)onDrop(el);
    }
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',end);
    handle.addEventListener('pointercancel',end);
    handle.addEventListener('lostpointercapture',end);
  }

  var css=document.createElement('style');
  css.textContent='.lmn-draggable{cursor:grab}.lmn-draggable.lmn-dragging{cursor:grabbing}body.lmn-drag-live{user-select:none;-webkit-user-select:none}body.lmn-drag-live iframe{pointer-events:none}';
  document.head.appendChild(css);

  // Artist rooms: windows and wall things move; the desktop is the container.
  // Every drop is remembered: in this browser always, and on the room itself
  // when the shop owner (or the artist) is signed in, so it becomes everyone's.
  var bedroom=document.querySelector('.bedroom');
  var roomKey=window.__ROOM_KEY__||null,layout=null,storeKey=roomKey?'lmn-desk:'+roomKey:null;
  function readLocal(){try{var v=storeKey&&localStorage.getItem(storeKey);return v?JSON.parse(v):null;}catch(e){return null;}}
  function writeLocal(){try{if(storeKey){if(layout&&Object.keys(layout).length)localStorage.setItem(storeKey,JSON.stringify(layout));else localStorage.removeItem(storeKey);}}catch(e){}}
  var toastEl=null,toastT=null;
  function toast(msg){if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000;color:#fff;font:12px Tahoma,Arial,sans-serif;padding:8px 14px;border:1px solid #fff;z-index:2147483647;opacity:0;transition:opacity .25s;pointer-events:none';document.body.appendChild(toastEl);}toastEl.textContent=msg;toastEl.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(function(){toastEl.style.opacity='0';},1800);}
  var saveT=null;
  function saveRemote(){if(!roomKey)return;clearTimeout(saveT);saveT=setTimeout(function(){
    fetch('/api/room/layout',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({artistId:roomKey,layout:layout})})
      .then(function(r){if(r.ok)toast(layout?'Desk saved for everyone':'Desk reset for everyone');})
      .catch(function(){});
  },500);}
  if(bedroom){
    var sel='.br-win, .bedroom-sticker, .bedroom-wall-poster, .bedroom-polaroid, .bedroom-poster';
    var counts={};
    [].slice.call(bedroom.querySelectorAll(sel)).forEach(function(el){
      var type=el.classList.contains('br-win')?'win':el.classList.contains('bedroom-sticker')?'sticker':el.classList.contains('bedroom-wall-poster')?'poster':el.classList.contains('bedroom-polaroid')?'polaroid':'big';
      counts[type]=(counts[type]||0)+1;el.dataset.lmnKey=type+'-'+(counts[type]-1);
      attach(el,{container:bedroom});
    });
    onDrop=function(el){
      if(!el.dataset.lmnKey)return;
      var crect=bedroom.getBoundingClientRect(),r=el.getBoundingClientRect();
      layout=layout||{};
      layout[el.dataset.lmnKey]={l:Math.round(((r.left-crect.left)/crect.width)*10000)/100,t:Math.round(r.top-crect.top)};
      writeLocal();saveRemote();
      if(resetBtn)resetBtn.style.display='';
    };
    // Restore: this browser's arrangement wins, then the room's saved one.
    var saved=readLocal()||window.__ROOM_LAYOUT__||null;
    if(saved&&!smallTouch&&window.innerWidth>=768&&Object.keys(saved).length){
      layout=saved;
      freezeFlow(bedroom);
      var crect0=bedroom.getBoundingClientRect();
      [].slice.call(bedroom.querySelectorAll('[data-lmn-key]')).forEach(function(el){
        var p=saved[el.dataset.lmnKey];if(!p)return;
        var cs=getComputedStyle(el);
        if(cs.position!=='absolute'&&cs.position!=='fixed'){el.style.width=el.getBoundingClientRect().width+'px';el.style.position='absolute';}
        el.style.left=(p.l/100*crect0.width)+'px';el.style.top=p.t+'px';el.style.right='auto';el.style.bottom='auto';el.style.margin='0';
        var bottom=p.t+el.getBoundingClientRect().height+32;if(bottom>bedroom.clientHeight)bedroom.style.minHeight=bottom+'px';
      });
    }
    // Reset: back to the designed desk (and, if allowed, for everyone).
    resetBtn=document.createElement('button');
    resetBtn.type='button';resetBtn.textContent='\u21ba reset desk';
    resetBtn.style.cssText='position:fixed;left:12px;bottom:44px;z-index:2147483000;background:rgba(0,0,0,0.55);color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:6px;padding:6px 10px;font:11px Tahoma,Arial,sans-serif;cursor:pointer;display:'+(layout?'':'none');
    resetBtn.addEventListener('click',function(){layout=null;writeLocal();saveRemote();setTimeout(function(){location.reload();},650);});
    if(!smallTouch)document.body.appendChild(resetBtn);
  }
  window.lmnDrag={attach:attach};
})();
</script>

  // room data). The legacy path map stays as a fallback; homepage is random.
  var songIdMap={'offspring':0,'goldfinger':1,'no-doubt':2,'shorty':3,'outkast':4,'blink182':5,'manson':6};
  var roomSong=(typeof window.__ROOM_SONG_ID__==='string'&&songIdMap.hasOwnProperty(window.__ROOM_SONG_ID__))?songIdMap[window.__ROOM_SONG_ID__]:null;
  var currentTrack=(roomSong!==null)?roomSong:((path in pageTrackMap)?pageTrackMap[path]:Math.floor(Math.random()*playlist.length));
  if(ytMode){currentTrack=0;for(var k=0;k<playlist.length;k++){if(playlist[k].yt===roomTv.id){currentTrack=k;break;}}}

  // YouTube plumbing (room pages): the IFrame API over postMessage, no SDK.
  var yt=ytMode?document.getElementById('jd-mtv'):null,ytLoaded=ytMode?roomTv.id:null,ytDur=0;
  function ytCmd(f,a){if(yt&&yt.contentWindow){try{yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*');}catch(e){}}}
  if(ytMode){
    setInterval(function(){if(yt&&yt.contentWindow){try{yt.contentWindow.postMessage(JSON.stringify({event:'listening',id:'winamp',channel:'widget'}),'*');}catch(e){}}},1000);
    window.addEventListener('message',function(e){
      if(typeof e.data!=='string'||!yt||e.source!==yt.contentWindow)return;
      var m;try{m=JSON.parse(e.data);}catch(x){return;}
      if(m.event==='infoDelivery'&&m.info){
        if(typeof m.info.duration==='number'&&m.info.duration>0)ytDur=m.info.duration;
        if(typeof m.info.currentTime==='number'){elapsed.textContent=formatTime(m.info.currentTime);if(ytDur){var pct=Math.min(100,m.info.currentTime/ytDur*100);seekFill.style.width=pct+'%';seekThumb.style.left=pct+'%';}}
        if(m.info.playerState===1&&!isPlaying){isPlaying=true;clearActive();playBtn.classList.add('winamp-active');startEQ();}
        if(m.info.playerState===2&&isPlaying){isPlaying=false;clearActive();pauseBtn.classList.add('winamp-active');stopEQ();}
      }
      if(m.event==='onStateChange'&&m.info===0){nextTrack();}
    });
  }

  function loadTrack(i){
    currentTrack=i;
    var t=playlist[i];
    marquee.textContent=t.title+' ***';
    if(ytMode){
      elapsed.textContent='00:00';seekFill.style.width='0%';seekThumb.style.left='0%';ytDur=0;
      if(ytLoaded!==t.yt){ytCmd(isPlaying?'loadVideoById':'cueVideoById',[{videoId:t.yt}]);ytLoaded=t.yt;}
      if(window.__lmnMtvTitle)window.__lmnMtvTitle({name:t.title,num:t.num});
    } else {
      audio.src=t.src;
    }
  }

  function nextTrack(){
    var next=(currentTrack+1)%playlist.length;
    loadTrack(next);
    if(isPlaying)doPlay();
  }

  function prevTrack(){
    var prev=(currentTrack-1+playlist.length)%playlist.length;
    loadTrack(prev);
    if(isPlaying)doPlay();
  }

  // Load track — artist room starts with their song, homepage is random
  loadTrack(currentTrack);

  function formatTime(s){if(isNaN(s))return'00:00';var m=Math.floor(s/60),sec=Math.floor(s%60);return(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
  audio.addEventListener('timeupdate',function(){elapsed.textContent=formatTime(audio.currentTime);if(audio.duration&&!isNaN(audio.duration)){var pct=(audio.currentTime/audio.duration)*100;seekFill.style.width=pct+'%';seekThumb.style.left=pct+'%';}});
  audio.addEventListener('ended',function(){nextTrack();});
  seekBar.addEventListener('click',function(e){var rect=seekBar.getBoundingClientRect(),frac=(e.clientX-rect.left)/rect.width;if(ytMode){if(ytDur)ytCmd('seekTo',[frac*ytDur,true]);return;}if(!audio.duration||isNaN(audio.duration))return;audio.currentTime=frac*audio.duration;});
  function setVolume(p){p=Math.max(0,Math.min(1,p));volFill.style.width=(p*100)+'%';volThumb.style.left=(p*100)+'%';audio.volume=p;if(ytMode)ytCmd('setVolume',[Math.round(p*100)]);}
  volTrack.addEventListener('click',function(e){var r=volTrack.getBoundingClientRect();setVolume((e.clientX-r.left)/r.width);});
  function startEQ(){if(eqInterval)return;eqInterval=setInterval(function(){for(var i=0;i<bars.length;i++)bars[i].style.height=(Math.random()*18+2)+'px';},100);}
  function stopEQ(){if(eqInterval){clearInterval(eqInterval);eqInterval=null;}for(var i=0;i<bars.length;i++)bars[i].style.height='2px';}
  function clearActive(){playBtn.classList.remove('winamp-active');pauseBtn.classList.remove('winamp-active');stopBtn.classList.remove('winamp-active');}
  function doPlay(){if(ytMode){var t=playlist[currentTrack];if(ytLoaded!==t.yt){ytCmd('loadVideoById',[{videoId:t.yt}]);ytLoaded=t.yt;}ytCmd('unMute');ytCmd('playVideo');}else{var p=audio.play();if(p&&p.catch)p.catch(function(){});}isPlaying=true;clearActive();playBtn.classList.add('winamp-active');startEQ();}
  function doPause(){if(ytMode){ytCmd('pauseVideo');}else{audio.pause();}isPlaying=false;clearActive();pauseBtn.classList.add('winamp-active');stopEQ();}
  function doStop(){if(ytMode){ytCmd('pauseVideo');ytCmd('seekTo',[0,true]);}else{audio.pause();audio.currentTime=0;}isPlaying=false;clearActive();stopBtn.classList.add('winamp-active');stopEQ();elapsed.textContent='00:00';seekFill.style.width='0%';seekThumb.style.left='0%';}
  // The MTV icon starts the song if Winamp is idle when the window slides in.
  window.__winampPlay=doPlay;
  window.__winampIsPlaying=function(){return isPlaying;};
  playBtn.addEventListener('click',doPlay);pauseBtn.addEventListener('click',doPause);stopBtn.addEventListener('click',doStop);
  prevBtn.addEventListener('click',function(){prevTrack();});
  nextBtn.addEventListener('click',function(){nextTrack();});
  closeBtn.addEventListener('click',function(e){e.stopPropagation();player.classList.toggle('winamp-shaded');});
  minBtn.addEventListener('click',function(e){e.stopPropagation();player.classList.toggle('winamp-shaded');});
  // Phones: docked and shaded to start; a tap on the title bar opens it.
  var phone=window.innerWidth<=600;
  if(phone){player.classList.add('winamp-shaded');titlebar.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')return;player.classList.toggle('winamp-shaded');});}
  // Dragging: the site-wide engine (below), title bar is the handle.
  if(window.lmnDrag)window.lmnDrag.attach(player,{handle:titlebar,fixed:true});
  setVolume(0.75);
})();
</script>

<div id="clippy-container" aria-hidden="true">
  <div id="clippy-bubble">
    <div id="clippy-bubble-text">It looks like you're trying to get a tattoo! Would you like help?</div>
    <div id="clippy-buttons">
      <button type="button" id="clippy-btn-book">Ask Clippy &rarr;</button>
      <button id="clippy-btn-dismiss">Go away</button>
    </div>
    <div id="clippy-bubble-tail"></div>
  </div>
  <div id="clippy-character">
    <img src="https://images.squarespace-cdn.com/content/60007bfc3f491826496124f4/e64042c5-f1a0-4370-b0a3-3706e10268c8/Clippy.webp?content-type=image%2Fwebp" alt="Clippy" id="clippy-img">
  </div>
</div>
<style>
  #clippy-container { position:fixed; bottom:44px; left:24px; z-index:999999; transform:translateY(240px); transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; pointer-events:none; }
  /* Let clicks pass through Clippy's empty container to the taskbar/start button beneath; keep Clippy itself clickable. */
  #clippy-bubble, #clippy-character { pointer-events:auto; }
  #clippy-container.clippy-visible { transform:translateY(0); }
  #clippy-container.clippy-hiding { transform:translateY(240px); transition:transform 0.4s ease-in; }
  #clippy-bubble { position:relative; background:#FFFFCC; border:2px solid #000; border-radius:8px; padding:14px 16px 12px; margin-bottom:8px; max-width:220px; box-shadow:2px 2px 0 rgba(0,0,0,0.15); opacity:0; transform:scale(0.8); transition:opacity 0.3s ease,transform 0.3s ease; }
  #clippy-container.clippy-visible #clippy-bubble { opacity:1; transform:scale(1); transition-delay:0.4s; }
  #clippy-bubble-tail { position:absolute; bottom:-10px; left:24px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:10px solid #000; }
  #clippy-bubble-tail::after { content:''; position:absolute; top:-12px; left:-8px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:8px solid #FFFFCC; }
  #clippy-bubble-text { font-size:13px; line-height:1.4; color:#000; margin-bottom:12px; }
  #clippy-buttons { display:flex; gap:8px; }
  #clippy-btn-book { background:#222; color:#fff !important; border:none; padding:6px 14px; border-radius:3px; font-size:12px; cursor:pointer; text-decoration:none !important; font-weight:600; transition:background 0.2s; }
  #clippy-btn-book:hover { background:#444; color:#fff !important; }
  #clippy-btn-dismiss { background:transparent; color:#555; border:1px solid #999; padding:6px 12px; border-radius:3px; font-size:12px; cursor:pointer; }
  #clippy-btn-dismiss:hover { background:#eee; color:#000; }
  #clippy-character { animation:clippy-bob 3s ease-in-out infinite; cursor:pointer; }
  #clippy-img { display:block; width:100px; height:auto; filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.1)); }
  @keyframes clippy-bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
  @media (max-width:640px) { #clippy-container { left:12px; } #clippy-character { transform-origin:bottom left; scale:0.75; } #clippy-bubble { max-width:180px; padding:10px 12px; } #clippy-bubble-text { font-size:12px; } #clippy-buttons { flex-direction:column; gap:6px; } #clippy-btn-book,#clippy-btn-dismiss { text-align:center; } }
</style>
<script>
// Clippy is the front desk (legacy/shopbot-y2k.html turns his bubble into the
// chat). He shows up after a few seconds with the offer; Go away tucks the
// bubble but leaves him in the corner, one click away, for the session.
(function(){var c=document.getElementById('clippy-container'),d=document.getElementById('clippy-btn-dismiss');if(sessionStorage.getItem('clippy-gone')){c.classList.add('clippy-gone');}var quiet=!!sessionStorage.getItem('clippy-dismissed');setTimeout(function(){if(quiet)c.classList.add('clippy-quiet');c.classList.add('clippy-visible');},quiet?2000:8000);d.addEventListener('click',function(){c.classList.add('clippy-gone');sessionStorage.setItem('clippy-gone','1');});var b=document.getElementById('clippy-btn-book');if(b)b.addEventListener('click',function(){window.dispatchEvent(new Event('lmn-shopbot-open'));});})();
</script>

<script>
(function(){var o=new Audio('https://raw.githubusercontent.com/LumenatiProductions/lumenati-tattoo/main/aim-open.mp3'),c=new Audio('https://raw.githubusercontent.com/LumenatiProductions/lumenati-tattoo/main/aim-close.mp3');o.volume=0.3;c.volume=0.3;
function obs(){var a=document.querySelectorAll('.lmn-artist');if(!a.length)return;
var ob=new MutationObserver(function(m){m.forEach(function(mu){if(mu.type!=='attributes'||mu.attributeName!=='class')return;var el=mu.target;if(!el.classList.contains('lmn-artist'))return;
var was=(mu.oldValue||'').indexOf('is-open')!==-1,is=el.classList.contains('is-open');
if(!was&&is){o.currentTime=0;o.play().catch(function(){});}else if(was&&!is){c.currentTime=0;c.play().catch(function(){});}});});
a.forEach(function(card){ob.observe(card,{attributes:true,attributeFilter:['class'],attributeOldValue:true});});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',obs);else obs();})();
</script>

<!-- ═══ WINAMP VS THE TASKBAR ═══ Pages with a desktop taskbar: Winamp steps up while the bar is on screen. -->
<script>
(function(){var taskbar=document.querySelector('.taskbar');if(!taskbar)return;var on=null;function check(){var r=taskbar.getBoundingClientRect();var vis=r.top<window.innerHeight&&r.bottom>0;if(vis!==on){on=vis;document.body.classList.toggle('lmn-taskbar-in',vis);}}window.addEventListener('scroll',check,{passive:true});window.addEventListener('resize',check);check();})();
</script>
